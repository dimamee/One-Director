# One Director — project metadata and tool configuration.
#
# Dependencies are NOT declared here: they live in requirements.in /
# requirements-dev.in and are locked with hashes by pip-compile (README).
# The package is not installed; tools find it via `src/` (pytest pythonpath,
# mypy_path, PYTHONPATH in Docker).

[project]
name = "one-director"
version = "0.0.0"
description = "Screening of possible bid-rigging indicators in public procurement of Uzbekistan"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# ---------------------------------------------------------------------------
# Ruff: lint + format. "S" = flake8-bandit security rules.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["data", "notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # flake8-bandit (security)
    "BLE",      # no blind `except Exception`
    "T20",      # no print(): output must go through the redacting logger
    "G",        # logging: no f-strings / % in log calls (structured logs)
    "DTZ",      # timezone-aware datetimes only (audit_log, flags)
    "PTH",      # pathlib (safer path handling for /reports)
    "C4", "SIM", "PT", "RUF",
    "PLC2401",  # identifiers must be ASCII (English names, no homoglyph tricks)
    "PLC2403",  # imported names must be ASCII
]
ignore = [
    # The project legitimately contains Russian/Uzbek Cyrillic text in strings,
    # docstrings and comments (UI texts, forbidden phrases, glossary). Homoglyph
    # protection for identifiers is covered by PLC2401/PLC2403 above.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point; fake secrets/hardcoded passwords are fixtures;
# subprocess is used to ask git about ignore rules.
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

# ---------------------------------------------------------------------------
# Mypy: strict for src/.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["one_director"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# Libraries without type information (stubs are added later only if justified).
module = ["pyvis.*", "shap.*", "sklearn.*", "networkx.*", "reportlab.*", "plotly.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Bandit: run as `bandit -c pyproject.toml -r src`.
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "notebooks", "data"]
# No global skips. Any `# nosec` must name the test id and carry a reason.

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
markers = [
    "security: security regression tests (docs/threat-model.md, tests/security/)",
]
